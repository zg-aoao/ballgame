<style>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=720,G=1500,R=11,BR=430;
const SEG=[{a:-600,b:1000,y:H-100,s:0}];
function segGen(x){let l=SEG[SEG.length-1];while(l.b<x+3000&&l.b<endX+200){const a=l.b+rnd(130,250),L=rnd(450,850);if(a>=endX+200)break;l={a,b:Math.min(a+L,endX+200),y:H-rnd(70,120),s:rnd(-.14,.14)};SEG.push(l)}}
function segAt(x){segGen(x);for(const s of SEG)if(s.b>=x)return s;return SEG[SEG.length-1]}
const gyN=x=>{const s=segAt(x);return x>=s.a&&x<=s.b?s.y+s.s*(x-(s.a+s.b)/2):null};
const sy=x=>H-215+20*Math.sin(x*.0017),gs=x=>(sy(x+2)-sy(x-2))/4;
let W,sc;
function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;sc=cv.height/H;W=cv.width/sc}
addEventListener('resize',rs);rs();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- audio ---------- */
let AC,master,droneG,nb,muted=false,lastS=0,lastH=0;
function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const o=AC.createOscillator(),f=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=42;f.type='lowpass';f.frequency.value=140;
  droneG=AC.createGain();droneG.gain.value=0;
  o.connect(f);f.connect(droneG);droneG.connect(master);o.start();
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,d,type='sine',v=.3,f2){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d);
}
function noise(d,v,fq){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nb;f.type='lowpass';f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(80,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d);
}
const PENTA=[0,2,4,7,9,12,14,16,14,12,9,7,4,2];
function sBounce(){const n=392*Math.pow(2,PENTA[combo%PENTA.length]/12);tone(n,.4,'sine',.28);tone(n*2,.18,'triangle',.08);tone(140,.12,'sine',.25,60)}
function sHit(v){if(time-lastH<.08)return;lastH=time;tone(220,.12,'square',.07+v*.08,110);noise(.07,.12*v,1400)}
function sBump(){tone(660,.25,'triangle',.22,990);tone(990,.22,'sine',.13)}
function sCrash(p){if(time-lastS<.07)return;lastS=time;noise(.55,.45*p,1000);tone(95,.4,'sawtooth',.16*p,40)}
function sThump(p){tone(55,.28,'sine',.45*p,32)}
function sRoar(){noise(1,.7,350);tone(72,.9,'sawtooth',.4,26)}
function sPop(){tone(500,.15,'square',.14,1200);tone(300,.22,'triangle',.2,90)}
function sChomp(p){noise(.2,.5*p,2000);tone(70,.22,'square',.22*p,34)}
function sGrowl(p){
  if(!AC)return;
  const t=AC.currentTime,D=1.9,v=.3*clamp(p,.6,1);
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.12);g.gain.setValueAtTime(v,t+1.4);g.gain.exponentialRampToValueAtTime(.001,t+D);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.linearRampToValueAtTime(350,t+D);
  const trem=AC.createGain();trem.gain.value=.6;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=26;lg.gain.value=.4;lfo.connect(lg);lg.connect(trem.gain);lfo.start(t);lfo.stop(t+D);
  for(const [ty,f1,f2,a] of [['sawtooth',72,48,1],['sawtooth',75,51,.8],['square',144,96,.4]]){
    const o=AC.createOscillator(),og=AC.createGain();o.type=ty;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+D);
    og.gain.value=a;o.connect(og);og.connect(trem);o.start(t);o.stop(t+D);
  }
  trem.connect(lp);lp.connect(g);g.connect(master);
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();
  s.buffer=nb;s.loop=true;bp.type='bandpass';bp.Q.value=1.2;
  bp.frequency.setValueAtTime(500,t);bp.frequency.linearRampToValueAtTime(260,t+D);
  ng.gain.value=.9;s.connect(bp);bp.connect(ng);ng.connect(g);s.start(t);s.stop(t+D);
  tone(55,.6,'sine',.5*clamp(p,.6,1),28);
}
document.getElementById('snd').onclick=e=>{e.stopPropagation();muted=!muted;e.target.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.5;applyBgm()};
document.getElementById('start').onclick=function(){initAudio();AC.resume();this.style.display='none';started=true;applyBgm()};

/* ---------- state ---------- */
const STORY0=["很久以前，有一颗不愿停下的小白球。","它没有翅膀，只会一次次弹起。","身后的黑影，是被遗忘的长夜。","长夜追着它，吞掉沿途的一切。","幸好有一块沉默的木板，在下面等它。","木板从不说话，只是每一次都接住它。","障碍越来越多，路越来越窄。","可小球还是向右，向着有光的地方。","有人说，尽头是黎明。","也有人说，它只是习惯了奔跑。","没关系，路还很长。"];
const LOOP0=["继续向右。","黑影仍在身后。","木板仍在下面。"];
const PARA=[
"长夜荒芜，天地死寂，整片大陆被阴霾与死寂笼罩。",
"曾有一位无畏的勇士，踏遍千山万水，执剑奔赴深渊，只为拯救自己此生唯一的挚爱。彼时，一头身形遮天的巨型怪物盘踞荒域，掳走了他最珍视的女孩。他不顾一切奔赴战场，以凡人之躯抗衡巨兽，拼尽全力击溃怪物的防御，闯破层层黑暗牢笼，可到头来，废墟狼藉之间，空空如也。",
"他翻遍怪物盘踞的每一寸土地，寻遍破碎的山石与荒芜的暗影，始终找不到她的踪迹。",
"没有人知道结局，也没有一丝线索。他无从知晓，她是被巨兽吞噬，消散在世间再也无归期；还是侥幸存活，散落于无人知晓的远方。这份无解的答案，成了困住他一生的枷锁，成了心底永远无法愈合的空洞。",
"这场救赎没有圆满，没有告别，只剩下无尽的未知与彻骨的遗憾。",
"更残酷的命运接踵而至。重伤未死的巨型怪物，自此盯上了他的踪迹，挣脱黑暗，永世追逐。从白昼到黑夜，从荒原到险峰，岁月漫漫，时光流转，春夏秋冬反复更迭，逃亡成了他生活的全部。",
"他永远在奔跑，永远在逃离巨兽的追捕，身后是步步紧逼、遮天蔽日的死亡阴影，身前是无尽漫长、看不到尽头的前路。",
"漫长的逃亡岁月里，危险从未停歇，疲惫浸透骨血，可他从未忘记初心。无数个狼狈逃窜的瞬间，无数个孤身独行的日夜，女孩的模样一遍遍浮现在他脑海。是初见时的温柔笑意，是相伴时的细碎温柔，是离别前的满眼期许。",
"世人皆以为，他奔波逃亡，是为了活下去。",
"可只有他自己知道，他拼尽全力躲过每一次追杀，咬牙熬过每一段绝境，从未放弃奔跑，从来不是为了求生。",
"他在等一个虚无缥缈的可能。",
"他在守一段无处安放的思念。",
"巨兽穷追不舍，执念岁岁长存，这场关于死亡与爱意的追逐，自此，无休无止，永不落幕。"];
const STORY=[];
for(const p of PARA){let cur='';for(const c of p.match(/[^，。；]+[，。；]?/g)){if(cur&&(cur+c).length>22){STORY.push(cur);cur=c}else cur+=c}if(cur)STORY.push(cur);STORY.push('')}
while(STORY.length&&!STORY[STORY.length-1])STORY.pop();
const DEFSTORY=STORY.slice();
function buildStory(text){const S=[];for(const p of text.split(/\n+/).map(s=>s.trim()).filter(Boolean)){let cur='';for(const c of(p.match(/[^，。；！？,.;!?]+[，。；！？,.;!?]?/g)||[p])){if(cur&&(cur+c).length>22){S.push(cur);cur=c}else cur+=c}if(cur)S.push(cur);S.push('')}while(S.length&&!S[S.length-1])S.pop();return S}
let endX=0,ended=false,endT=0;
function computeEnd(){endX=(650+(Math.max(1,STORY.length)-1)*1100)/.85+60}
function setStory(arr){STORY.length=0;STORY.push(...(arr.length?arr:DEFSTORY));computeEnd()}
try{const t=localStorage.getItem('ballstory');if(t)setStory(buildStory(t))}catch(e){}
computeEnd();
let ball,pad,boss,obs,parts,trail,cam,shake,combo,time,genX;
function init(){
  ball={x:200,y:300,vx:260,vy:0};pad={x:200,sq:0,aim:0,w:140};
  boss={x:-560,ph:0,roar:0,st:0,ms:'hold',mt:0,mn:0,o:.04,dark:0,rings:[]};obs=[];parts=[];trail=[];cam=0;shake=0;combo=0;time=0;genX=900;
}
init();

function spawn(){
  const t=Math.random(),x=genX;let o;
  if(t<.18)o={t:'b',x,y:rnd(150,430),w:rnd(50,90),h:rnd(50,110)};
  else if(t<.32)o={t:'h',x,y:0,w:rnd(46,80),h:rnd(140,300)};
  else if(t<.44)o={t:'c',x:x+30,y:rnd(220,430),r:rnd(26,38)};
  else if(t<.54)o={t:'p',x,y:rnd(300,440),w:rnd(140,220),h:22};
  else if(t<.66){const s=segAt(x),h=rnd(80,170),w=rnd(36,60),px=clamp(x,s.a+20,s.b-w-20);o={t:'w',x:px,y:s.y+s.s*(px+w/2-(s.a+s.b)/2)-h,w,h:h+60}}
  else if(t<.82){const s=segAt(x),px=clamp(x,s.a+90,s.b-90);o={t:'m',x:px,ox:px,sa:s.a,sb:s.b,y:0,r:24,ph:rnd(0,6)}}
  else o={t:'f',x,ox:x,oy:rnd(200,400),y:300,r:18,ph:rnd(0,6)};
  o.hit=0;obs.push(o);genX+=rnd(280,460)+(o.w||60);
}
function clearPath(x0,y0,vx,vy){
  const T=2*-vy/G;
  for(let t=.03;t<T;t+=.035){
    const px=x0+vx*t,py=y0+vy*t+.5*G*t*t;
    for(const o of obs){
      if(o.r||o.x>px+150||o.x+o.w<px-150)continue;
      if(px>o.x-R-4&&px<o.x+o.w+R+4&&py>o.y-R-4&&py<o.y+o.h+R+4)return false;
    }
  }
  return true;
}
function launch(){
  const x0=ball.x,y0=sy(ball.x)-R,c=[];
  for(let i=0;i<14;i++){
    const h=rnd(170,430),D=rnd(260,520),T=2*Math.sqrt(2*h/G);
    c.push({vx:D/T,vy:-Math.sqrt(2*G*h)});
  }
  const ok=c.filter(a=>clearPath(x0,y0,a.vx,a.vy));
  const p=(ok.length&&Math.random()>.12)?ok[Math.random()*ok.length|0]:c[Math.random()*c.length|0];
  ball.vx=p.vx;ball.vy=p.vy;ball.y=y0;
  pad.sq=1;pad.aim=rnd(-30,30);
  combo++;
}
let predT=1;
function predict(){
  const a=.5*G,b=ball.vy;let x1=ball.x;
  for(let k=0;k<3;k++){
    const c=ball.y-(sy(x1)-R),d=b*b-4*a*c;
    if(d<0){predT=1;return ball.x}
    let t=(-b+Math.sqrt(d))/(2*a);if(t<0)t=0;
    predT=t;x1=ball.x+ball.vx*t;
  }
  return x1;
}
function burst(x,y,n,col,boost){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-150,350)+boost,vy:rnd(-520,-40),l:1,s:rnd(4,12),r:rnd(0,6),c:col});
}
function shatter(o){
  const cx=o.r?o.x:o.x+o.w/2,cy=o.r?o.y:o.y+o.h/2;
  burst(cx,cy,18,o.t==='c'?'#ff4f9a':o.r?'#5b2a86':'#8e2f6a',250);
  sCrash(clamp(1-Math.abs(cx-ball.x)/1500,.15,1));
  shake=Math.max(shake,7);
}
function collide(o){
  if(o.t==='m'||o.t==='f'){
    if(Math.hypot(ball.x-o.x,ball.y-o.y)<o.r+R){o.dead=1;burst(o.x,o.y,14,o.t==='m'?'#6b2a8f':'#4a2a7a',120);ball.vy=-520;ball.vx=Math.max(ball.vx,260);sPop();shake=Math.max(shake,5)}
    return;
  }
  if(o.t==='c'){
    const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),m=o.r+R;
    if(d<m&&d>0){
      const nx=dx/d,ny=dy/d;ball.x=o.x+nx*m;ball.y=o.y+ny*m;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=2*vn*nx;ball.vy-=2*vn*ny}
      ball.vx+=nx*260;ball.vy+=ny*260;if(ball.vx<260)ball.vx=260;
      o.hit=1;sBump();
    }
    return;
  }
  const cx=clamp(ball.x,o.x,o.x+o.w),cy=clamp(ball.y,o.y,o.y+o.h);
  let dx=ball.x-cx,dy=ball.y-cy;const d2=dx*dx+dy*dy;
  if(d2>=R*R)return;
  let d=Math.sqrt(d2),nx,ny;
  if(d===0){nx=0;ny=-1;d=0}else{nx=dx/d;ny=dy/d}
  ball.x=cx+nx*R;ball.y=cy+ny*R;
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ball.vx-=1.6*vn*nx;ball.vy-=1.6*vn*ny;sHit(clamp(-vn/900,.2,1))}
  if(ny<-.5&&ball.vx<160)ball.vx=170;
  if(nx<-.5)ball.vy=Math.min(ball.vy,-380);
  o.hit=1;
}

function bossMouth(dt,pr){
  const b=boss;b.mt+=dt;
  if(b.ms==='hold'){b.o=.04;if(b.mt>.6){b.mn++;b.ms=b.mn%3===0?'rin':'open';b.mt=0;if(b.ms==='rin')sGrowl(pr)}}
  else if(b.ms==='open'){b.o=.04+.96*Math.sin(Math.min(1,b.mt/.55)*Math.PI/2);if(b.mt>.55){b.ms='bite';b.mt=0}}
  else if(b.ms==='bite'){const k=Math.min(1,b.mt/.14);b.o=1-.96*k*k;if(b.mt>.14){b.o=.04;b.ms='hold';b.mt=0;sChomp(pr);shake=Math.max(shake,12+10*pr);burst(b.x+430,H-340,8,'#2a0a20',250)}}
  else if(b.ms==='rin'){b.o=.04+1.1*Math.min(1,b.mt/.35);if(b.mt>.35){b.ms='roar';b.mt=0;b.ring=0}}
  else if(b.ms==='roar'){b.o=1.1+Math.sin(time*40)*.03;shake=Math.max(shake,6+8*pr);b.ring+=dt;if(b.ring>.22){b.ring=0;b.rings.push({r:0})}if(b.mt>1.5){b.ms='rout';b.mt=0}}
  else{b.o=1.14-1.1*Math.min(1,b.mt/.6);if(b.mt>.6){b.ms='hold';b.mt=0}}
}
/* ---------- update ---------- */
function step(dt){
  if(ended){endT+=dt;return}
  time+=dt;
  while(genX<cam+W+700&&genX<endX-350)spawn();
  while(SEG.length>3&&SEG[0].b<cam-1500)SEG.shift();
  for(const o of obs){
    if(o.t==='m'){o.x=clamp(o.ox+Math.sin(time*1.3+o.ph)*70,o.sa+30,o.sb-30);o.y=(gyN(o.x)??H)-o.r}
    else if(o.t==='f'){o.x=o.ox+Math.sin(time*1.1+o.ph)*45;o.y=o.oy+Math.sin(time*2.2+o.ph)*35}
  }
  // paddle (autonomous)
  const tgt=predict()+pad.aim,tc=Math.max(predT,.03);
  pad.x+=clamp((tgt-pad.x)*Math.min(1,dt/tc),-1600*dt,1600*dt);
  pad.sq=Math.max(0,pad.sq-dt*5);
  // ball
  for(let s=0;s<2;s++){
    const h=dt/2;ball.vy+=G*h;ball.x+=ball.vx*h;ball.y+=ball.vy*h;
    const gb=gyN(ball.x);
    if(gb!==null&&ball.vy>0&&ball.y+R>gb&&ball.y<gb+30){ball.y=gb-R;ball.vy=-420;ball.vx=Math.max(ball.vx*.9,120);combo=0;tone(110,.15,'sine',.2,70)}
    if(ball.y>H+250){ball.y=-40;ball.vy=0;ball.x=Math.max(ball.x,boss.x+520);combo=0}
    const sf=sy(ball.x);
    if(ball.vy>0&&ball.y+R>=sf&&ball.y+R<=sf+30&&Math.abs(ball.x-pad.x)<pad.w/2+R*.6)launch();
    for(const o of obs)if(Math.abs((o.x+(o.w||0)/2)-ball.x)<200)collide(o);
  }
  // boss
  const gap=ball.x-boss.x;
  const v=clamp(240+(gap-520)*.6,90,1000)*(boss.ms==='roar'?.35:1);
  boss.x+=v*dt;boss.ph+=v*dt*.018;boss.roar=Math.max(0,boss.roar-dt*1.5);
  const pr=clamp(1-gap/1400,.25,1);
  bossMouth(dt,pr);
  {const on=boss.ms==='roar'||boss.ms==='rin';boss.dark+=((on?1:0)-boss.dark)*Math.min(1,dt*(on?5:2))}
  for(const r of boss.rings)r.r+=900*dt;
  boss.rings=boss.rings.filter(r=>r.r<1400);
  const st=Math.floor(boss.ph/Math.PI);
  if(st!==boss.st){boss.st=st;const p=clamp(1-gap/1400,.1,1);sThump(p);if(gap<900)shake=Math.max(shake,3+4*p)}
  if(droneG)droneG.gain.value=muted?0:clamp(1-gap/1300,0,1)*.22;
  for(const o of obs)if((o.r?o.x-o.r:o.x)<boss.x+BR&&!o.dead){o.dead=1;shatter(o)}
  obs=obs.filter(o=>!o.dead);
  if(!ended&&ball.x>=endX){ended=true;showEnd()}
  if(ball.x<boss.x+380){
    ball.x=boss.x+440;ball.vx=720;ball.vy=-980;shake=28;boss.roar=1;boss.x-=140;combo=0;sRoar();
    burst(ball.x,ball.y,20,'#000',300);
  }
  // camera & fx
  cam+=(ball.x-W*.42-cam)*Math.min(1,4*dt);
  trail.push({x:ball.x,y:ball.y,l:1});if(trail.length>22)trail.shift();
  for(const t of trail)t.l-=dt*2.2;
  for(const p of parts){p.vy+=G*.7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*6;p.l-=dt*.9}
  parts=parts.filter(p=>p.l>0&&p.y<H+50);
  for(const o of obs)o.hit=Math.max(0,o.hit-dt*4);
  shake*=.9;
}

/* ---------- draw ---------- */
function hills(par,base,amp,col,f){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+20;x+=20){const u=(x+cam*par)*f;ctx.lineTo(x,base-amp*(Math.sin(u)+.5*Math.sin(u*2.3+2)))}
  ctx.lineTo(W+20,H);ctx.fill();
}
function jaw(s,ang,st,big){
  ctx.save();ctx.rotate(s*ang);ctx.beginPath();
  ctx.moveTo(-700,s*1400);ctx.lineTo(450,s*1400);ctx.lineTo(680,s*154);ctx.lineTo(590,s*4);
  for(let x=st,i=0;x>0;x-=78,i++){const L=i===0?200:(i%2===big?130:90);ctx.lineTo(x,s*4);ctx.lineTo(x-39,s*(4-L));ctx.lineTo(x-78,s*4)}
  ctx.lineTo(-50,s*4);ctx.lineTo(-700,s*4);ctx.closePath();ctx.fill();ctx.restore();
}
function drawBoss(){
  const bx=boss.x-cam,roar=boss.ms==='roar';
  const ang=boss.o*.56+(roar?Math.sin(time*50)*.015:0);
  const jx=(boss.ms==='bite'?60*Math.min(1,boss.mt/.14):0)+Math.sin(boss.ph*2)*6+(roar?Math.sin(time*60)*5:0);
  const hx=bx-250+jx,hy=H-340;
  ctx.save();ctx.translate(hx,hy);ctx.fillStyle='#000';
  ctx.fillRect(-700,-1400,700,2800);
  jaw(-1,ang,510,1);jaw(1,ang,470,0);
  ctx.restore();
  ctx.save();ctx.translate(hx+330,hy);ctx.lineWidth=14;
  for(const r of boss.rings){ctx.strokeStyle='rgba(215,140,185,'+(.14*(1-r.r/1400))+')';ctx.beginPath();ctx.arc(0,0,r.r,-1.1,1.1);ctx.stroke()}
  if(roar){ctx.font="700 84px 'PingFang SC','Microsoft YaHei',sans-serif";ctx.textAlign='left';ctx.fillStyle='#000';ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=12;ctx.fillText('吼——',120+Math.sin(time*45)*8,Math.cos(time*52)*8+30)}
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(sc,sc);
  const hue=Math.sin(time*.05)*10;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${340+hue},100%,96%)`);g.addColorStop(.55,`hsl(${332+hue},95%,90%)`);g.addColorStop(1,`hsl(${318+hue},80%,82%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);
  // sun & bokeh
  const sg=ctx.createRadialGradient(W*.72,170,10,W*.72,170,130);
  sg.addColorStop(0,'rgba(255,255,255,.75)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(W*.72-140,30,280,280);
  for(let i=0;i<12;i++){
    const m=W+200,x=(((i*337-cam*.3)%m)+m)%m-100,y=(i*97)%480+40;
    ctx.fillStyle='rgba(255,255,255,.13)';ctx.beginPath();ctx.arc(x,y+Math.sin(time*.5+i)*8,10+(i%5)*8,0,7);ctx.fill();
  }
  hills(.2,H-190,60,'rgba(255,255,255,.35)',.003);
  hills(.5,H-120,50,'rgba(225,120,170,.2)',.004);
  // story
  const p=.85,sp=1100;
  ctx.textAlign='center';
  try{ctx.letterSpacing='5px'}catch(e){}
  for(let i=Math.max(0,Math.floor((cam*p-300)/sp));i<=Math.floor((cam*p+W)/sp);i++){
    const tx=650+i*sp-cam*p,al=clamp(Math.min(tx,W-tx)/220,0,1);
    const sT=STORY[i];if(!sT)continue;
    ctx.font='600 36px "PingFang SC","Noto Serif SC","Microsoft YaHei",serif';
    const fs=Math.min(36,36*W*.9/ctx.measureText(sT).width);
    ctx.font=`600 ${fs}px "PingFang SC","Noto Serif SC","Microsoft YaHei",serif`;
    ctx.globalAlpha=al*.95;ctx.fillStyle='#000';ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=10;
    ctx.fillText(sT,tx,130+(i*53%110));
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // discontinuous ground islands
  segGen(cam+W);
  for(const s of SEG){
    if(s.b<cam-100||s.a>cam+W+100)continue;
    const m=(s.a+s.b)/2,ya=s.y+s.s*(s.a-m),yb=s.y+s.s*(s.b-m),ax=s.a-cam,bx=s.b-cam;
    ctx.beginPath();ctx.moveTo(ax,ya);ctx.lineTo(bx,yb);ctx.lineTo(bx-70,H+10);ctx.lineTo(ax+70,H+10);ctx.closePath();
    ctx.fillStyle='#e07aa8';ctx.fill();
    ctx.lineWidth=6;ctx.strokeStyle='#ffc2dc';ctx.beginPath();ctx.moveTo(ax,ya);ctx.lineTo(bx,yb);ctx.stroke();
  }
  // finish gate
  const gx=endX-cam;
  if(gx>-120&&gx<W+120){
    const gg=ctx.createLinearGradient(gx-60,0,gx+60,0);
    gg.addColorStop(0,'rgba(255,255,255,0)');gg.addColorStop(.5,'rgba(255,255,255,.9)');gg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gg;ctx.fillRect(gx-60,0,120,H);
    ctx.font="700 48px 'PingFang SC','Microsoft YaHei',sans-serif";ctx.textAlign='center';ctx.fillStyle='#000';ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=10;ctx.fillText('终点',gx,200);ctx.shadowBlur=0;
  }
  // obstacles
  for(const o of obs){
    const sx=o.x-cam;if(sx>W+100||sx<-400)continue;
    if(o.t==='m'||o.t==='f'){
      const dr=Math.sign(ball.x-o.x)*2;
      ctx.fillStyle=o.t==='m'?'#5b2a86':'#4a2a7a';
      if(o.t==='m'){ctx.beginPath();ctx.arc(sx,o.y,o.r,Math.PI,0);ctx.lineTo(sx+o.r,o.y+o.r);ctx.lineTo(sx-o.r,o.y+o.r);ctx.fill()}
      else{
        const fl=Math.sin(time*16)*12;
        for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(sx+d*8,o.y);ctx.lineTo(sx+d*40,o.y-14+fl);ctx.lineTo(sx+d*22,o.y+8);ctx.fill()}
        ctx.beginPath();ctx.arc(sx,o.y,o.r,0,7);ctx.fill();
      }
      for(const e of[-7,7]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+e,o.y-3,5,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx+e+dr,o.y-3,2.5,0,7);ctx.fill()}
    }else if(o.t==='c'){
      const r=o.r*(1+.15*o.hit);
      ctx.beginPath();ctx.arc(sx,o.y,r,0,7);ctx.fillStyle='#ff4f9a';ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
      ctx.beginPath();ctx.arc(sx,o.y,r*.45,0,7);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
    }else{
      ctx.fillStyle=o.hit>.1?'#d65aa0':(o.t==='p'?'#a63a7b':o.t==='h'?'#7d2a63':'#8e2f6a');
      ctx.beginPath();ctx.roundRect(sx,o.y,o.w,o.h,8);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(sx+4,o.y+4,o.w-8,5);
    }
  }
  // particles
  for(const q of parts){
    ctx.globalAlpha=clamp(q.l,0,1);ctx.fillStyle=q.c;
    ctx.save();ctx.translate(q.x-cam,q.y);ctx.rotate(q.r);ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s);ctx.restore();
  }
  ctx.globalAlpha=1;
  // trail & ball
  for(const t of trail){ctx.globalAlpha=Math.max(0,t.l)*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x-cam,t.y,R*Math.max(.2,t.l),0,7);ctx.fill()}
  ctx.globalAlpha=1;
  ctx.shadowColor='rgba(180,40,110,.6)';ctx.shadowBlur=16;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ball.x-cam,ball.y,R,0,7);ctx.fill();ctx.shadowBlur=0;
  // paddle
  const sq=pad.sq,pw=pad.w*(1+.12*sq),ph=14*(1-.4*sq);
  ctx.shadowColor='rgba(180,40,110,.5)';ctx.shadowBlur=12;ctx.fillStyle='#fff';
  ctx.save();ctx.translate(pad.x-cam,sy(pad.x));ctx.rotate(Math.atan(gs(pad.x)));ctx.beginPath();ctx.roundRect(-pw/2,14-ph,pw,ph,7);ctx.fill();ctx.restore();ctx.shadowBlur=0;
  // boss
  drawBoss();
  ctx.restore();
  if(boss.dark>.003){ctx.fillStyle='rgba(60,0,40,'+(boss.dark*(.1+.05*Math.sin(time*30)))+')';ctx.fillRect(0,0,W,H)}
  // hud
  ctx.textAlign='left';ctx.font='600 16px "PingFang SC","Microsoft YaHei",sans-serif';
  try{ctx.letterSpacing='2px'}catch(e){}
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.shadowColor='rgba(150,30,90,.35)';ctx.shadowBlur=6;
  ctx.fillText(Math.floor(Math.max(0,ball.x-200)/50)+' m',20,36);ctx.shadowBlur=0;
}
const $=id=>document.getElementById(id);
function restart(){SEG.length=0;SEG.push({a:-600,b:1000,y:H-100,s:0});init();ended=false;endT=0;$('end').classList.remove('on')}
function showEnd(){shake=0;$('end').classList.add('on');tone(523,1.4,'sine',.2);tone(659,1.6,'sine',.15);tone(784,2,'sine',.15)}
function openImp(){$('imp').classList.add('on');try{$('ta').value=localStorage.getItem('ballstory')||''}catch(e){}}
$('book').onclick=e=>{e.stopPropagation();openImp()};
document.querySelectorAll('.impb').forEach(b=>b.onclick=e=>{e.stopPropagation();openImp()});
$('again').onclick=e=>{e.stopPropagation();restart()};
$('cls').onclick=()=>$('imp').classList.remove('on');
$('def').onclick=()=>{try{localStorage.removeItem('ballstory')}catch(e){}$('ta').value='';setStory(DEFSTORY.slice());$('imp').classList.remove('on');restart()};
$('load').onclick=()=>{const t=$('ta').value.trim();if(t){try{localStorage.setItem('ballstory',t)}catch(e){}setStory(buildStory(t))}else setStory(DEFSTORY.slice());$('imp').classList.remove('on');restart()};
function readF(f){if(!f)return;const r=new FileReader();r.onload=()=>{$('ta').value=r.result};r.readAsText(f)}
$('file').onchange=e=>{readF(e.target.files[0]);e.target.value=''};
$('ta').ondragover=e=>e.preventDefault();
$('ta').ondrop=e=>{e.preventDefault();readF(e.dataTransfer.files[0])};
let started=false,bgm=null;
function applyBgm(){
  if(!bgm)return;
  if(muted||!started)bgm.pause();else{const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}
}
function setBgm(blob,name){
  if(bgm){bgm.pause();URL.revokeObjectURL(bgm.src);bgm=null}
  if(blob){bgm=new Audio(URL.createObjectURL(blob));bgm.loop=true;bgm.volume=.5;applyBgm()}
  $('mname').textContent=blob?(name||'已选择'):'未选择（可不选）';
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ballgame',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function bgmSave(b){try{const d=await idb(),s=d.transaction('k','readwrite').objectStore('k');if(b)s.put(b,'bgm');else s.delete('bgm')}catch(e){}}
async function bgmLoad(){try{const d=await idb(),q=d.transaction('k').objectStore('k').get('bgm');q.onsuccess=()=>{if(q.result)setBgm(q.result,q.result.name)}}catch(e){}}
$('mfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setBgm(f,f.name);bgmSave(f)};
$('mclr').onclick=()=>{setBgm(null);bgmSave(null)};
for(const id of['load','def','cls'])$(id).addEventListener('click',()=>applyBgm());
bgmLoad();
let last=performance.now();
function loop(n){
  const dt=Math.min((n-last)/1000,1/30);last=n;
  step(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
